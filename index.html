<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Personal Hub</title>
    <meta name="description" content="A private personal productivity hub integrating follow-ups, fast daily expenses & money accounts, dual-currency INR/SAR personal loans, notes, calendar, security lock screen, and encrypted backup." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#0b0f19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Personal Hub" />
    <meta name="application-name" content="Personal Hub" />

    <!-- OpenGraph / Social Cards -->
    <meta property="og:title" content="Personal Hub" />
    <meta property="og:description" content="A private personal productivity hub integrating follow-ups, fast daily expenses & money accounts, dual-currency INR/SAR personal loans, notes, calendar, security lock screen, and encrypted backup." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('[SW] Registered successfully with scope:', reg.scope);
            })
            .catch(function(err) {
              console.error('[SW] Registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
